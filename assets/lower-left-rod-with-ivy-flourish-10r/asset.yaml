# descriptive: find it and understand it
id: lower-left-rod-with-ivy-flourish-10r
title: Margin rod with ivy spray, fol. 10r
description: A bottom-left corner piece of the page border. A vertical gold rod edged in pink, with a blue and a pink chevron inlay set into it, ends above in a pink curl with a blue flower and gold trefoil leaves and below in a gold leaf cluster, from which a pink stem runs to the right along the bottom carrying gold trefoil ivy leaves, blue and rust-pink flowers and fine black hairline tendrils. The stem is cut at the top edge where it continued up the margin; the background is transparent.
