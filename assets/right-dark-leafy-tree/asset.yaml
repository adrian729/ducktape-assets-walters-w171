id: right-dark-leafy-tree
title: Round bushy tree with grey fruits, right
description: A round-headed tree from the Fountain of Life miniature. A dense dark green crown with a scalloped outline fills the upper two thirds, with brown branches, pale grey-white fruits and a few lighter leaves showing through it; two thin grey-brown trunks run down from the crown and cross near the cut base at the bottom. Painted edges, no outline; the background is transparent.
