id: dark-green-scorpion-with-raised-tail
title: Scorpio, dark green scorpion
description: The Scorpio sign from the zodiac initial, drawn as a dark green lizard-like creature rather than a bird. A plump body lies diagonally with a long tapering tail pointing to the upper left, two tufts of spiky legs on the underside and a small curled head with bristling appendages at the lower right. Dark green with gold-brown streaks and black shading; the background is transparent.
