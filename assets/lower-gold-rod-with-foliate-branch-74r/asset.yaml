title: Margin rod with foliate branch, lower, fol. 74r
description: A bottom-left corner piece of the page border. A short vertical gold rod edged in pink ends above in a pink spiral with a gold trefoil leaf and a blue flower, and below in a gold leaf cluster from which a long pink stem runs to the right along the bottom, throwing off gold trefoil ivy leaves, red and blue flowers with white centres and fine black hairline curls. Black outlines throughout; the background is transparent.
