# descriptive: find it and understand it
id: tarnished-crescent-moon
title: Dark crescent moon, horns down
description: A crescent moon lying like an arch with both horns pointing down, cut from the bottom of the oval night sky of the folio. Its paint is a dark, tarnished green-black with a streak of dull gold along the inner left limb and traces of the blue ground at the rim. The background is transparent.
