# descriptive: find it and understand it
id: upper-gold-rod-with-foliate-branch-19v
title: Margin rod with foliate branch, upper, fol. 19v
description: A top-left corner piece of the page border. A tall vertical gold rod edged in pink, with a pink chevron inlay set into its middle, ends below in a pink spiral holding a gold trefoil leaf, with a red flower and gold leaves beside it; at the top a gold leaf cluster sends a pink stem to the right along the top edge carrying gold trefoil ivy leaves, red and blue bell flowers and fine black hairline curls, and a small sprig with two gold buds hangs beside the rod. Black outlines; the background is transparent.
