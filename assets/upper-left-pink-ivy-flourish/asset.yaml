id: upper-left-pink-ivy-flourish
title: Ivy spray corner, upper left, fol. 12r
description: A top-left corner piece of the page border without a rod. A pink stem edged in white rises from a spiral at the lower left, where a gold trefoil leaf and a blue flower sit inside the curl, bends over and runs to the right along the top carrying gold trefoil ivy leaves with white centres, two blue and two red-orange bell flowers and fine black hairline tendrils; a second small spiral with a gold leaf closes the stem at the bottom. Black outlines; the background is transparent.
