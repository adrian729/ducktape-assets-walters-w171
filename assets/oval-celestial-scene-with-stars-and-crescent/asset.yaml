# descriptive: find it and understand it
id: oval-celestial-scene-with-stars-and-crescent
title: Oval night sky with stars and crescent
description: A tall oval of deep blue sky with a rim of lighter blue brushstrokes following its edge. Three gold six-pointed stars sit in the upper left and upper right, a gold disc crossed by dark curved bands lies right of centre, and a dark worn crescent with its horns down sits at the bottom left. A fourth star and much of the lower half are abraded to a pale green-grey ground. Opaque inside the oval, transparent outside.
