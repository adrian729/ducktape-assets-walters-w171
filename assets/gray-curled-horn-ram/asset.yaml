title: Aries, grey ram
description: The Aries sign from the zodiac initial. A grey-cream ram stands facing left in side view with its head lowered, two dark spiralling horns, a fleece drawn in curling brown strokes over a pale body and small dark hooves. Gold flecks over the fleece, white highlights and black outlines; the background is transparent.
