title: Pisces, upper fish
description: The upper fish of the Pisces pair from the zodiac initial. A long fish swims to the left in side view, its back dark blue-grey and its belly silver-grey with white highlights and gold flecks; the dorsal fin, pectoral and pelvic fins and the forked tail are edged in red. Black outlines; the background is transparent.
