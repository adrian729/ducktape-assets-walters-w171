id: seated-maiden-holding-small-flowers
title: Virgo, seated maiden with flowers
description: The Virgo sign from the zodiac initial. A young woman with gold hair sits on the ground in a long brown gown whose folds spread to the lower right, her body turned to the right and her head tilted back towards the viewer; her raised right hand holds a thin stem with a gold flower and a second gold-flowered sprig rises from her lap. Pale face and hands with pink shading, white highlights on the gown and black outlines; the background is transparent.
