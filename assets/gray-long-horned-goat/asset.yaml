title: Capricorn, grey goat
description: The Capricorn sign from the zodiac initial, drawn as an ordinary goat. A grey goat stands facing right in side view with two long dark horns sweeping back from its head, a small beard, a shaggy coat drawn in wavy white and dark grey strokes and dark cloven hooves. Gold flecks over the coat and black outlines; the background is transparent.
