id: gold-scales-with-two-blue-pans
title: Libra, balance with two blue pans
description: The Libra sign from the zodiac initial. A blue beam edged with white rests on a gold and blue two-legged post topped by a small bird-like finial with a pale head and a red-spotted body; from each end of the beam three gold cords hang a round blue pan with white highlights. Black outlines; the background is transparent.
