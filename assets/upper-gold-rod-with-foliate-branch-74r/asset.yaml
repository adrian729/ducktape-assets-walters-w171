id: upper-gold-rod-with-foliate-branch-74r
title: Margin rod with foliate branch, upper, fol. 74r
description: A top-left corner piece of the page border. A tall vertical gold rod edged in pink, with a pink chevron inlay set into its middle, ends below in a pink curl with a gold trefoil and a red flower; at the top a gold leaf cluster sends a pink stem to the right along the top edge carrying gold trefoil ivy leaves, red and blue flowers with white centres and fine black hairline curls, and a small sprig with two gold buds hangs beside the rod. Black outlines throughout; the background is transparent.
