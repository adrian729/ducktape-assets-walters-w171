id: two-gold-pointed-leaves-on-fine-curled-stem
title: Two gold leaves on a crossed stem
description: A tall narrow sprig in black pen with two pointed gold leaves outlined in black, one at the top and one at the bottom, joined by a thin stem that crosses itself in a loose knot at the middle and throws out short curls; a hooked tendril closes each end. The gold is worn and dull. The background is transparent.
