# descriptive: find it and understand it
id: fruit-tree-with-branching-trunk
title: Tree of life with red fruits
description: A tall tree with a straight olive-brown trunk edged in gold that spreads into a flat base of short roots and branches into three rounded clumps of dark green foliage, one above the other two. Twelve round rust-red fruits hang among the leaves, each with a dark stalk, and the leaves carry pale grey highlights and flecks of gold where the paint has worn. The background is transparent.
