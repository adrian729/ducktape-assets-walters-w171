id: left-dark-leafy-tree
title: Slender tree with grey fruits, left
description: A tall slender tree from the Fountain of Life miniature. A dark olive-brown trunk with gold flecks curves up from a cut base at the lower left to a small crown of dark green lobed leaves at the top, with pale grey-white fruits hanging among the upper leaves and a few leaves scattered down the right side of the stem. Painted edges, no outline; the background is transparent.
