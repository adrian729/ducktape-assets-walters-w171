# descriptive: find it and understand it
id: upper-left-curled-ivy-with-trefoils
title: Curled ivy stem with gold trefoils
description: A thick grey-pink stem edged in white curls into a spiral at the lower centre and sends branches up and to the left, each ending in a gold trefoil ivy leaf with a white centre; a blue three-lobed flower with white highlights sits inside the spiral and a cluster of gold leaves closes its tail at the lower left. Fine grey hairline tendrils trail from the leaves. The paint is worn, with parchment showing through the gold. The background is transparent.
