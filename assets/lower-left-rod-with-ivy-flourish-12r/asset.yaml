# descriptive: find it and understand it
id: lower-left-rod-with-ivy-flourish-12r
title: Margin rod with ivy spray, fol. 12r
description: A bottom-left corner piece of the page border. A tall vertical gold rod edged in pink, with a pink chevron inlay set into its middle, ends above in a pink curl with a gold trefoil leaf and below in a gold leaf cluster from which a pink stem runs to the right along the bottom carrying gold trefoil ivy leaves, blue and red-orange flowers with white centres and fine black hairline tendrils; a small sprig with two gold buds hangs beside the rod. Black outlines; the background is transparent.
