# descriptive: find it and understand it
id: red-crab-with-raised-claws
title: Cancer, red crab
description: The Cancer sign from the zodiac initial, drawn like a crayfish. A red-orange crustacean lies diagonally with its head and two black-dot eyes at the upper left, two large claws raised above it, four thin legs spread to the right and below, and a segmented tail curving down to the lower right. Dark red shading, gold flecks and black outlines; the background is transparent.
