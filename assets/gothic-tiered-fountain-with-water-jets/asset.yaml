# descriptive: find it and understand it
id: gothic-tiered-fountain-with-water-jets
title: Gothic fountain of life
description: The stone fountain from the Fountain of Life miniature, seen from slightly above. A grey-green octagonal basin on a stepped base carries an upper hexagonal basin and a central Gothic pavilion with pointed arches, crockets and a tall crocketed spire ending in a cross; two spouts in the upper basin and six spouts round the lower basin pour wavy white and blue jets of water down the sides. Gold highlights along the right edges, dark green shading; the background is transparent.
