# descriptive: find it and understand it
id: blue-white-opposed-chevron-repeat
title: Blue chevron inlay, repeat tile
description: One cycle of the blue painted inlay of the gold margin rod, cut so the top and bottom edges join when stacked. A deep blue ground carries one hand-drawn cream chevron pair with short hooked bars, the paint ragged along the two long edges and darkening to black at the rim; the thin margins outside the paint are transparent.
type: border
categories:
  - geometric
subjects:
  - chevron
  - rod
colors:
  - blue
  - cream
  - black
facing: none
composition: repeat-tile

