# descriptive: find it and understand it
id: upper-blue-and-rust-ivy-sprig
title: Ivy sprig with blue and rust flowers
description: A sprig of three flowers on a dark green-black stem that curls in a loop at the centre and ends in fine hairline tendrils. A blue flower with white highlights sits at the upper left, a second blue one hangs at the bottom, and a rust-orange flower with a dark red bud opens to the right; all are outlined in near-black. The paint is worn, with pale parchment showing through the petals. The background is transparent.
