id: embracing-zodiac-twins
title: Gemini, embracing twins
description: The Gemini sign from the zodiac initial. Two fair-haired figures
  with curly gold hair sit side by side and embrace, the left one in a blue gown
  with a red belt looking up at the other, the right one in a brown-mauve gown
  with its arm round the first; their blue-clad legs stretch out together to the
  right. Cream faces and hands, black outlines; the background is transparent.
