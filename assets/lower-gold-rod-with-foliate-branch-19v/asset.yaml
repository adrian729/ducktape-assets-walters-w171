id: lower-gold-rod-with-foliate-branch-19v
title: Margin rod with foliate branch, lower, fol. 19v
description: A bottom-left corner piece of the page border. A short vertical gold rod edged in pink ends above in a pink curl with gold trefoil leaves and a red flower, and below in a gold leaf cluster from which a long pink stem runs to the right along the bottom, throwing off gold trefoil ivy leaves, a blue and a pale green-white bell flower, two red flowers and fine black hairline curls. Black outlines; the background is transparent.
