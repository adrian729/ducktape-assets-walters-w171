# descriptive: find it and understand it
id: pink-inlay-with-white-opposed-chevron-chain
title: Pink chevron inlay strip
description: A narrow vertical strip of the painted inlay from the gold margin
  rod of the folio, a dusty pink-brown ground carrying a chain of pale cream
  opposed chevrons and short hooked bars drawn by hand in a loose zigzag, about
  three cycles tall. The painted edges are ragged and darken to black where the
  paint meets the gold of the rod; the background is transparent.
type: divider
